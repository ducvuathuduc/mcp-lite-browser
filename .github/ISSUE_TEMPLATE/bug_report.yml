name: 🐛 Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/ducvuathuduc/mcp-lite-browser/issues) first, and never paste API keys or tokens.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-lite-browser version / commit
      placeholder: "v0.1.0 or a commit SHA"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: MCP server and SDK
      placeholder: "e.g. official Python SDK 2.x, Streamable HTTP, stateless"
  - type: input
    id: env
    attributes:
      label: Browser / Node version
  - type: textarea
    id: logs
    attributes:
      label: Logs or MCP traffic
      description: Relevant output. It is formatted as code automatically.
      render: shell

name: CI

on:
  push:
    branches: [main, v0.2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          # Node 18 has no global Web Crypto (crypto.subtle / getRandomValues) without this flag.
          NODE_OPTIONS: ${{ matrix.node == 18 && '--experimental-global-webcrypto' || '' }}
      - name: Size budget (≤ 10 kB min+gzip)
        run: npm run size
